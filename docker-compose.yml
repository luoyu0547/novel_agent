services:
  qdrant:
    image: qdrant/qdrant:v1.15.3
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:6333/healthz >/dev/null 2>&1']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
